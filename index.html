<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sunnakh</title>
  <meta name="description" content="sunnakh — AI &amp; ML Systems Engineer">
  <meta name="color-scheme" content="dark light">
  <script>
    try {
      var t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <style>
    :root {
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    }
    [data-theme="dark"] {
      --bg: #0d1117; --fg: #c9d1d9; --strong: #f0f6fc; --muted: #8b949e;
      --line: #30363d; --accent: #3fb950;
    }
    [data-theme="light"] {
      --bg: #f6f8fa; --fg: #24292f; --strong: #1f2328; --muted: #6e7781;
      --line: #d0d7de; --accent: #1a7f37;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh; background: var(--bg); color: var(--fg);
      font-family: var(--mono); font-size: 15px; line-height: 1.6;
      display: flex; flex-direction: column;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      max-width: 44rem; width: 100%; margin: 0 auto; padding: 20px 16px;
      color: var(--muted); font-size: 13px;
    }
    .host { color: var(--accent); }
    #theme {
      font: inherit; color: var(--muted); background: none; cursor: pointer;
      border: 1px solid var(--line); border-radius: 4px; padding: 2px 10px;
    }
    #theme:hover { color: var(--strong); border-color: var(--muted); }
    main {
      flex: 1; max-width: 44rem; width: 100%; margin: 0 auto;
      padding: 8vh 16px 48px;
    }
    .cmd { color: var(--muted); margin: 0; }
    .cmd::before { content: "$ "; color: var(--accent); }
    h1 {
      font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 600; color: var(--strong);
      margin: 6px 0 10px; letter-spacing: -0.01em;
    }
    .bio {
      font-family: var(--sans); font-size: 1.1rem; line-height: 1.65;
      margin: 0 0 36px; max-width: 34rem;
    }
    ul { list-style: none; padding: 0; margin: 6px 0 36px; }
    li { margin: 4px 0; display: flex; }
    li span { color: var(--muted); flex: 0 0 6.5rem; }
    li a { min-width: 0; overflow-wrap: anywhere; }
    @media (max-width: 360px) {
      body { font-size: 14px; }
      li span { flex-basis: 5rem; }
    }
    a { color: var(--accent); text-underline-offset: 3px; }
    a:hover { color: var(--strong); }
    .cursor {
      display: inline-block; width: 0.6em; height: 1.1em; vertical-align: text-bottom;
      background: var(--accent); animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    footer {
      max-width: 44rem; width: 100%; margin: 0 auto; padding: 20px 16px;
      color: var(--muted); font-size: 12px; border-top: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <header>
    <span><span class="host">sunnakh@github</span>:~</span>
    <button id="theme" type="button" aria-label="Toggle light/dark theme">◐</button>
  </header>

  <main>
    <p class="cmd">whoami</p>
    <h1>sunnakh</h1>
    <p class="bio">AI &amp; ML Systems Engineer</p>

    <p class="cmd">ls links/</p>
    <ul>
      <li><span>github</span><a href="https://github.com/sunnakh">github.com/sunnakh</a></li>
      <li><span>linkedin</span><a href="https://www.linkedin.com/in/sunnakh/">linkedin.com/in/sunnakh</a></li>
      <li><span>x</span><a href="https://x.com/sunnakh_">x.com/sunnakh_</a></li>
    </ul>

    <p class="cmd"><span class="cursor" aria-hidden="true"></span></p>
  </main>

  <footer>new site in progress — blog coming soon</footer>

  <script>
    document.getElementById("theme").addEventListener("click", function () {
      var root = document.documentElement;
      var next = root.dataset.theme === "dark" ? "light" : "dark";
      root.dataset.theme = next;
      try { localStorage.setItem("theme", next); } catch (e) {}
    });
  </script>
</body>
</html>
